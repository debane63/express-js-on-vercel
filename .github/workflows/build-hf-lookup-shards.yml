name: Build HF Lookup Shards

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-hf-lookup-shards.yml"
      - "scripts/build_hf_lookup_shards.py"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-hf-lookup-shards-v2
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'issues' ||
      github.event.issue.title == 'BUILD_HF_LOOKUP_SHARDS'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_URL: https://huggingface.co/datasets/deban420/my-first-data-api/resolve/main/train.parquet
      HF_BUCKET: deban420/my-fast-data-bucket
      HF_PREFIX: lookup-v1
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WORKDIR: /tmp/hf-index-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "duckdb>=1.4,<2" "huggingface_hub>=1.0,<2"

      - name: Build and upload shards
        run: python scripts/build_hf_lookup_shards.py
