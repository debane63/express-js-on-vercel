name: Secure HF Bucket

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  secure:
    if: github.event.issue.title == 'SECURE_HF_BUCKET'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q "huggingface_hub>=1.0,<2"
      - name: Make bucket private and verify
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import update_bucket_settings, bucket_info, list_bucket_tree
          token = os.environ["HF_TOKEN"]
          bucket = "deban420/my-fast-data-bucket"
          update_bucket_settings(bucket, private=True, token=token)
          info = bucket_info(bucket, token=token)
          print("BUCKET_PRIVATE=" + str(info.private).lower())
          print("BUCKET_FILES=" + str(info.total_files))
          print("BUCKET_SIZE=" + str(info.size))
          for item in list_bucket_tree(bucket, recursive=True, token=token):
              if getattr(item, "type", None) == "file":
                  print("FILE=" + str(item.path))
          PY
