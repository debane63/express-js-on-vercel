name: Deploy Hugging Face demo

on:
  workflow_dispatch:
  push:
    branches:
      - hf-write-bridge
    paths:
      - ".github/workflows/deploy-hf-demo.yml"
      - "hf_deploy/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Hugging Face client
        run: pip install -U "huggingface_hub>=0.35.0"

      - name: Verify HF token exists
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Missing GitHub Actions secret: HF_TOKEN"
            exit 1
          fi

      - name: Create dataset and Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python hf_deploy/create_demo.py
