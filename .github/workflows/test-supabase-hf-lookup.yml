name: Test Supabase HF Lookup

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  test:
    if: github.event.issue.title == 'TEST_SUPABASE_LOOKUP'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Run private lookup test
        run: |
          python - <<'PY'
          import os, hmac, hashlib, base64, json, urllib.request, urllib.error

          hf = os.environ["HF_TOKEN"].encode()
          raw = hmac.new(hf, b"aim-ai2-internal-test-v1", hashlib.sha256).digest()
          key = base64.urlsafe_b64encode(raw).decode().rstrip("=")

          url = "https://gynljghdntrcfgzqabfe.supabase.co/functions/v1/hf-lookup?search=1038991535&field=telegram_id"
          req = urllib.request.Request(url, headers={
              "x-api-key": key,
              "accept": "application/json",
          })

          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  status = r.status
                  body = json.loads(r.read().decode())
          except urllib.error.HTTPError as e:
              status = e.code
              body = json.loads(e.read().decode())

          safe = {
              "http_status": status,
              "success": body.get("success"),
              "status": body.get("status"),
              "count": body.get("count"),
              "elapsed_ms": body.get("elapsed_ms"),
              "error": body.get("error"),
          }
          print(json.dumps(safe))

          if status >= 500 or status == 401:
              raise SystemExit(1)
          PY
